name: Release

# Publishes @posted-sdk/react-native on every version tag.
#
# Tag format is `vX.Y.Z` (the release-it default used by this repo). The tag,
# package.json and src/version.ts must all carry the same version: version.ts
# feeds the X-SDK header, so a mismatch would mislabel installs.
#
# NPM_TOKEN must be a granular access token with "Bypass 2FA" (or a legacy
# automation token); the npm account has 2FA enabled, so a plain publish token
# fails with EOTP in CI.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to publish (e.g. v1.0.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # creates the GitHub Release
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Check package.json and version.ts match the tag
        working-directory: packages/react-native-posted-sdk
        run: |
          v="${{ steps.version.outputs.version }}"
          pkg_v=$(node -p "require('./package.json').version")
          ts_v=$(sed -nE 's/.*version = "([^"]+)".*/\1/p' src/version.ts)
          echo "tag=$v package.json=$pkg_v version.ts=$ts_v"
          [ "$pkg_v" = "$v" ] || { echo "::error::package.json version $pkg_v != tag $v"; exit 1; }
          [ "$ts_v" = "$v" ] || { echo "::error::src/version.ts version $ts_v != tag $v"; exit 1; }

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Skip if already on npm
        id: exists
        run: |
          v="${{ steps.version.outputs.version }}"
          if [ "$(npm view "@posted-sdk/react-native@$v" version 2>/dev/null)" = "$v" ]; then
            echo "@posted-sdk/react-native $v is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.published == 'false'
        working-directory: packages/react-native-posted-sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          v="${{ steps.version.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" --title "$tag" --notes "@posted-sdk/react-native $v on npm: \`npm install @posted-sdk/react-native@$v\`."
