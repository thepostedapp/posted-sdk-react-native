openapi: 3.1.0
info:
  title: Detour Attribution Backend — SDK⇄Backend Contract
  version: 1.0.0
  description: |
    **Authoritative, plug-and-play contract** for the Detour CPI / mobile-attribution
    backend. Reverse-engineered from all four client SDKs (React Native 2.3.0, Android
    1.1.0, iOS 1.1.0, Flutter 1.2.0 — which bridges to the native iOS/Android SDKs).

    A backend built to this spec MUST work with the existing SDKs **without any SDK
    changes**. Where the four platforms diverge, the divergence is documented inline and
    the contract is widened to accept every shape the SDKs emit and to remain compatible
    with every shape they parse.

    ## Conventions
    - All endpoints are `POST`, `application/json`, over HTTPS to `https://godetour.dev`.
    - No compression, no HMAC/request signing, no idempotency keys, no client retries.
    - Two timestamp conventions (intentional, see schemas): **epoch milliseconds** on the
      link endpoints, **ISO-8601 UTC** (`yyyy-MM-dd'T'HH:mm:ss.SSS'Z'`) on analytics.

    ## Reliability semantics the backend MUST honor
    - `match-link`, `resolve-short`: **fail-safe** — on any client-side error the SDK
      proceeds with the raw link. A 404 means "no match"; it is not an error.
    - `universal-link-click`: **fail-open click gate** — the SDK blocks the link ONLY on
      HTTP `402` or a `200` body with `allowed:false`. Any other non-2xx or transport
      error is treated as allowed. The SDK enforces a **5-second** timeout here, so the
      backend MUST respond well under 5s.
    - `analytics/event`, `analytics/retention`: **fire-and-forget** — response body is
      never parsed; only the HTTP status is checked.

servers:
  - url: https://godetour.dev
    description: Production (hardcoded in every SDK; not configurable)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer {apiKey}` — the publishable API key supplied at SDK configure()."

  parameters:
    XAppId:
      name: X-App-ID
      in: header
      required: true
      schema: { type: string }
      description: "Detour-issued app identifier supplied at SDK configure(). (OPEN-Q: exact semantics — bundle id vs Detour id — not validated client-side.)"
    XSdk:
      name: X-SDK
      in: header
      required: true
      schema:
        type: string
        examples: ["react-native/2.3.0", "android/1.1.0", "ios/1.1.0", "flutter/1.2.0"]
      description: |
        `{platform}/{version}`. Flutter overrides the native value at runtime via a
        marker class; if the marker is absent the native string (`android/…`/`ios/…`) is
        sent instead — so the backend cannot always distinguish Flutter from native.

  schemas:

    LocaleTag:
      type: object
      properties:
        languageTag: { type: string, examples: ["en-US"] }
      required: [languageTag]
      additionalProperties: false

    # ---- match-link request: two shapes at the same URL, discriminated by shape (no discriminator field) ----
    DeterministicMatch:
      type: object
      description: Sent by Android/RN when the install referrer carries a `click_id`.
      properties:
        clickId: { type: string }
      required: [clickId]
      additionalProperties: false

    ProbabilisticFingerprint:
      type: object
      description: |
        Probabilistic device fingerprint for deferred-deep-link matching when no
        deterministic click_id is available (always used on iOS/Flutter-iOS).
      properties:
        platform: { type: string, enum: [ios, android] }
        model: { type: string }
        manufacturer: { type: string }
        systemVersion: { type: string }
        screenWidth:
          type: number
          description: "UNIT DIVERGES BY PLATFORM — iOS: logical points (Double); Android: dp (int); RN: Dimensions 'screen' value. Do NOT assume pixel equality across platforms; combine with `scale`."
        screenHeight:
          type: number
          description: "Same unit divergence as screenWidth."
        scale:
          type: number
          description: "Pixel ratio / density (iOS UIScreen.scale, Android DisplayMetrics.density, RN PixelRatio.get())."
        locale:
          type: array
          items: { $ref: '#/components/schemas/LocaleTag' }
        timezone: { type: [string, "null"] }
        userAgent: { type: [string, "null"] }
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds.
        pastedLink:
          type: [string, "null"]
          description: "iOS only, when shouldUseClipboard is enabled and clipboard holds a probable URL; null/absent otherwise. Android always null."
      required: [platform, model, manufacturer, systemVersion, screenWidth, screenHeight, scale, locale, timestamp]
      additionalProperties: false

    LinkResponse:
      type: object
      description: Shared response for match-link. Only `link` is consumed by the SDKs.
      properties:
        link:
          type: [string, "null"]
          description: Matched deep-link URL, or null/absent when there is no match.
      required: [link]

    ResolveShortRequest:
      type: object
      properties:
        url: { type: string }
      required: [url]
      additionalProperties: false

    ResolveShortResponse:
      type: object
      description: |
        RN and Android read all three fields; iOS reads only `link`. `route`/`parameters`
        are therefore optional. `parameters` is a JSON-encoded string (OPEN-Q: confirm
        always-JSON vs query-string).
      properties:
        link: { type: string }
        route: { type: [string, "null"] }
        parameters:
          type: [string, "null"]
          description: JSON-encoded query parameters (string), e.g. '{"color":"red"}'.
      required: [link]

    UniversalLinkClickRequest:
      type: object
      properties:
        url: { type: string }
        timestamp: { type: integer, format: int64, description: Epoch milliseconds. }
        platform: { type: string, enum: [ios, android, unknown] }
        link_id:
          type: string
          description: "iOS only, optional — omitted from JSON entirely when absent."
        params:
          type: object
          additionalProperties: { type: string }
          description: URL query params; omitted entirely when empty.
        metadata:
          type: object
          description: Omitted entirely (RN) when all values are null.
          properties:
            os_version: { type: [string, "null"] }
            app_version: { type: [string, "null"] }
            device_model: { type: [string, "null"] }
          additionalProperties: false
      required: [url, timestamp, platform]
      additionalProperties: false

    UniversalLinkClickResponse:
      type: object
      description: |
        Click-gate verdict. The SDK blocks the link ONLY when `allowed` is false (or HTTP
        402). `remainingClicks` is consumed by RN/iOS and ignored by Android, so it is
        optional. All fields except `allowed` are optional.
      properties:
        allowed: { type: [boolean, "null"] }
        clickId: { type: [string, "null"] }
        error: { type: [string, "null"] }
        code: { type: [string, "null"] }
        clicksInPeriod: { type: [integer, "null"] }
        effectiveLimit: { type: [integer, "null"] }
        remainingClicks: { type: [integer, "null"] }
      required: [allowed]

    AnalyticsEventRequest:
      type: object
      properties:
        event_name:
          type: string
          description: |
            A predefined name or any custom string. Predefined set:
            login, search, share, sign_up, tutorial_begin, tutorial_complete, re_engage,
            invite, opened_from_push_notification, add_payment_info, add_shipping_info,
            add_to_cart, remove_from_cart, refund, view_item, begin_checkout, purchase,
            ad_impression, opened_via_universal_link (Android-only addition).
        data:
          description: Free-form caller-supplied payload; omitted when null/invalid JSON.
        timestamp: { type: string, format: date-time, description: "ISO-8601 UTC, ms precision." }
        platform: { type: string, enum: [ios, android] }
        device_id:
          type: string
          description: SDK-generated UUIDv4, persisted on-device (key `Detour_deviceId`). Not a hardware id.
      required: [event_name, timestamp, platform, device_id]
      additionalProperties: false

    RetentionEventRequest:
      type: object
      description: Same as analytics event but never carries `data`.
      properties:
        event_name: { type: string, description: "'app_open' fires once per process automatically; custom strings allowed." }
        timestamp: { type: string, format: date-time }
        platform: { type: string, enum: [ios, android] }
        device_id: { type: string }
      required: [event_name, timestamp, platform, device_id]
      additionalProperties: false

paths:
  /api/link/match-link:
    post:
      operationId: matchLink
      summary: Deferred deep-link match (first launch only)
      description: |
        Fires once per install at first launch. Accepts EITHER a deterministic
        `{clickId}` body OR a probabilistic device fingerprint — same URL, discriminated
        by shape. Uses the default client timeout (~15s Android, ~60s iOS).
      parameters: [{ $ref: '#/components/parameters/XAppId' }, { $ref: '#/components/parameters/XSdk' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeterministicMatch'
                - $ref: '#/components/schemas/ProbabilisticFingerprint'
            examples:
              deterministic:
                summary: Android/RN deterministic match (install referrer carried a click_id).
                value:
                  clickId: "abc123-click-789"
              probabilistic:
                summary: iOS/Flutter-iOS probabilistic device fingerprint (no click_id).
                value:
                  platform: ios
                  model: "iPhone15,3"
                  manufacturer: "Apple"
                  systemVersion: "17.5.1"
                  screenWidth: 430
                  screenHeight: 932
                  scale: 3
                  locale:
                    - languageTag: "en-US"
                  timezone: "America/New_York"
                  userAgent: "Detour/1.1.0 (iOS 17.5.1)"
                  timestamp: 1719158400000
                  pastedLink: null
      responses:
        '200':
          description: Match result. `{link:null}`/absent link means no attribution match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkResponse' }
              examples:
                matched:
                  value:
                    link: "https://godetour.dev/app/promo?ref=spring"
                noMatch:
                  value:
                    link: null
        '404':
          description: No matching deferred link (treated by SDK as no-match, not an error).
        default:
          description: Error. SDK extracts `error` from body, logs, and proceeds with no match.
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }

  /api/link/resolve-short:
    post:
      operationId: resolveShort
      summary: Expand a single-path-segment short link
      description: Expands a short link into its full deep link. Fail-safe — any error or 404 makes the SDK fall back to the raw URL.
      parameters: [{ $ref: '#/components/parameters/XAppId' }, { $ref: '#/components/parameters/XSdk' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveShortRequest' }
            examples:
              shortLink:
                value:
                  url: "https://godetour.dev/x9Az"
      responses:
        '200':
          description: Resolved link. Returning the input URL unchanged is treated as a loop and ignored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveShortResponse' }
              examples:
                resolved:
                  value:
                    link: "https://godetour.dev/app/product/42"
                    route: "/product/42"
                    parameters: '{"color":"red"}'
                linkOnly:
                  value:
                    link: "https://godetour.dev/app/product/42"
        '404':
          description: Short link not found — SDK falls back to the raw URL.
        default:
          description: Any error — SDK falls back to the raw URL (fail-safe).

  /api/link/universal-link-click:
    post:
      operationId: universalLinkClick
      summary: Click-limit gate for universal/app links
      description: |
        Fail-open gate. MUST respond in well under 5s (SDK timeout). Block the link with
        HTTP 402 or a 200 body `{allowed:false, ...}`; everything else lets the link
        proceed.
      parameters: [{ $ref: '#/components/parameters/XAppId' }, { $ref: '#/components/parameters/XSdk' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UniversalLinkClickRequest' }
            examples:
              click:
                summary: iOS click with query params and metadata.
                value:
                  url: "https://godetour.dev/u/launch?campaign=spring&variant=b"
                  timestamp: 1719158400000
                  platform: ios
                  link_id: "lnk_5567"
                  params:
                    campaign: "spring"
                    variant: "b"
                  metadata:
                    os_version: "17.5.1"
                    app_version: "3.2.0"
                    device_model: "iPhone15,3"
              clickMinimal:
                summary: Android minimal click (optional fields omitted entirely).
                value:
                  url: "https://godetour.dev/u/launch"
                  timestamp: 1719158400000
                  platform: android
      responses:
        '200':
          description: Verdict. `allowed:true` proceeds; `allowed:false` blocks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniversalLinkClickResponse' }
              examples:
                allowed:
                  value:
                    allowed: true
                    clickId: "clk_9931"
                    remainingClicks: 4
                denied:
                  value:
                    allowed: false
                    code: "LIMIT_REACHED"
                    clicksInPeriod: 10
                    effectiveLimit: 10
                    remainingClicks: 0
        '402':
          description: Explicit click-limit deny — link is blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniversalLinkClickResponse' }
              examples:
                denied402:
                  value:
                    allowed: false
                    error: "click limit reached"
                    code: "LIMIT_REACHED"
        default:
          description: Any other non-2xx — SDK fails open and allows the link.

  /api/analytics/event:
    post:
      operationId: analyticsEvent
      summary: Log an analytics event (fire-and-forget)
      description: Records a predefined or custom analytics event. Fire-and-forget — the SDK checks only the HTTP status and never parses the body.
      parameters: [{ $ref: '#/components/parameters/XAppId' }, { $ref: '#/components/parameters/XSdk' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsEventRequest' }
            examples:
              purchase:
                summary: Predefined event with a free-form data payload.
                value:
                  event_name: "purchase"
                  data:
                    order_id: "ord_1001"
                    value: 29.99
                    currency: "USD"
                    items: ["sku_a", "sku_b"]
                  timestamp: "2026-06-23T18:00:00.000Z"
                  platform: android
                  device_id: "8f2b1c9e-7d3a-4e21-9f10-2c5b6a1d4e88"
              customNoData:
                summary: Custom event name, data omitted.
                value:
                  event_name: "level_completed"
                  timestamp: "2026-06-23T18:01:30.500Z"
                  platform: ios
                  device_id: "8f2b1c9e-7d3a-4e21-9f10-2c5b6a1d4e88"
      responses:
        '200':
          description: Accepted. Body is not read by the SDK.
        default:
          description: Failure is logged client-side and dropped (no retry).

  /api/analytics/retention:
    post:
      operationId: analyticsRetention
      summary: Log a retention event (fire-and-forget)
      description: Records a retention/lifecycle event (e.g. the automatic once-per-process app_open). Fire-and-forget — only the HTTP status is checked.
      parameters: [{ $ref: '#/components/parameters/XAppId' }, { $ref: '#/components/parameters/XSdk' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionEventRequest' }
            examples:
              appOpen:
                summary: Automatic once-per-process app_open retention ping.
                value:
                  event_name: "app_open"
                  timestamp: "2026-06-23T18:02:00.000Z"
                  platform: ios
                  device_id: "8f2b1c9e-7d3a-4e21-9f10-2c5b6a1d4e88"
      responses:
        '200':
          description: Accepted. Body is not read by the SDK.
        default:
          description: Failure is logged client-side and dropped (no retry).
